name: Build LaTeX Notes and Python Assignments

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-latex:
    name: Compile LaTeX notes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra

      - name: Compile all weekly LaTeX notes
        run: |
          find notes -type f -name "week*.tex" | while read texfile; do
            echo "Compiling $texfile"
            latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error -cd "$texfile"
          done

      - name: Upload compiled PDFs
        uses: actions/upload-artifact@v4
        with:
          name: compiled-notes-pdfs
          path: notes/**/*.pdf

  check-python:
    name: Check Python assignments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Check Python syntax
        run: |
          if [ -d assignments ]; then
            python -m compileall assignments
          else
            echo "No assignments folder found."
          fi

      - name: Run tests if they exist
        run: |
          if [ -d tests ]; then
            pytest
          else
            echo "No tests folder found, skipping tests."
          fi